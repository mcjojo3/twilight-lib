plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "twilight_lib-neoforge-refmap.json"
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}



dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.property('1_21_1_neoforge_version')}"
    modApi "dev.architectury:architectury-neoforge:${rootProject.property('1_21_1_architectury_version')}"

    // Force inclusion of dependencies if Loom fails to map them

    // jsr305 is now in allprojects
    // Remove the next line if you don't actually depend on the common code
    common(project(path: ":1.21.1:common", configuration: "namedElements")) { transitive = false }
    shadowCommon(project(path: ":1.21.1:common", configuration: "transformProductionNeoForge")) { transitive = false }
}

processResources {
    var replaceProperties = [
            minecraft_version: rootProject.property('1_21_1_minecraft_version'),
            minecraft_version_range: "[1.21.1,1.22)",
            neoforge_version: rootProject.property('1_21_1_neoforge_version'),
            neoforge_version_range: "[21.1,)",
            loader_version_range: "[4,)",
            mod_id: rootProject.mod_id,
            mod_name: rootProject.mod_name,
            mod_license: rootProject.mod_license,
            mod_version: rootProject.mod_version,
            mod_authors: rootProject.mod_authors,
            mod_description: rootProject.mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":1.21.1:common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
