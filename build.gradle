println ""
println "   WARNING: Root build.gradle is deprecated!"
println "   Each module is now a standalone project."
println "   Build them individually:"
println "     cd forge-1.20.1 && ./gradlew build"
println "     cd neoforge-1.21.1 && ./gradlew build"
println ""
