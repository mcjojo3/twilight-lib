plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.145'
}

// NeoForge 1.21.1 module
version = "${mod_version}"
group = mod_group_id

base {
    archivesName = "${mod_id}-1.21.1"
}

// Mojang ships Java 21 to end users in 1.21, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

runs {
    configureEach {
        // Modpath for the run
        modSource project.sourceSets.main

        // Logging config
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    client {
        // Enable game tests on client
        systemProperty 'forge.enableGameTest', 'true'
        programArgument '-mixin.config=twilight_lib.mixins.json'
    }

    server {
        programArgument '--nogui'
        programArgument '-mixin.config=twilight_lib.mixins.json'
    }

    gameTestServer {
        systemProperty 'forge.enableGameTest', 'true'
    }

    data {
        programArguments.addAll '--mod', mod_id,
                                '--all',
                                '--output', file('src/generated/resources/').getAbsolutePath(),
                                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Include generated resources and common shared resources
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    // Include common resources (shared between Forge and NeoForge)
    srcDir '../common'
}

repositories {
    mavenCentral()
    // NeoForge maven repository
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

// Force ASM 9.8 and exclude Forge/Minecraft conflicts
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.ow2.asm') {
            details.useVersion '9.8'
            details.because 'Force ASM 9.8 for NeoForge compatibility'
        }
    }

    // Exclude only MinecraftForge group (NOT cpw.mods which is needed by NeoForge)
    exclude group: 'net.minecraftforge'
}

dependencies {
    // NeoForge dependency
    implementation "net.neoforged:neoforge:21.1.213"

    // Mixin annotation processor
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// Process resources to replace properties
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: '1.21.1',
            minecraft_version_range: '[1.21.1,1.22)',
            neoforge_version: '21.1',
            neoforge_version_range: '[21.1,)',
            loader_version_range: '[4,)',
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Configure JAR task
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'twilight_lib.mixins.json'
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Add Mixin annotation processor arguments for refmap generation
    options.compilerArgs << "-AoutSrgFile=${buildDir}/tmp/compileJava/mixin.refmap.srg"
    options.compilerArgs << "-AoutRefMapFile=${buildDir}/resources/main/twilight_lib.refmap.json"
    options.compilerArgs << "-AdefaultObfuscationEnv=searge"
}

// IDEA module settings
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
